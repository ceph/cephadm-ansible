queue_rules:
  - name: default
    # GitHub branch protection currently injects only github-review-approved.
    # Require the Jenkins statuses reported by cephadm-ansible-prs so a PR
    # that is already up-to-date cannot skip CI and merge while jobs are pending.
    merge_conditions:
      - 'check-success="Testing: flake8"'
      - 'check-success="Testing: mypy"'
      - 'check-success="Testing: unittests"'
      - 'check-success="Testing: el9-functional"'
      - 'check-success="Testing: el10-functional"'
      - label != DNM

pull_request_rules:
  - name: backport squid
    conditions:
      - label=backport-squid
    actions:
      backport:
        branches:
          - squid
  - actions:
      backport:
        branches:
          - reef
    conditions:
      - label=backport-reef
    name: backport reef
  - actions:
      backport:
        branches:
          - quincy
    conditions:
      - label=backport-quincy
    name: backport quincy
  - actions:
      backport:
        branches:
          - pacific
    conditions:
      - label=backport-pacific
    name: backport pacific
commands_restrictions:
  backport:
    conditions:
      - base=devel
      - number<0
